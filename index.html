<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0"> <!-- displays site properly based on user's device -->

  <link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:ital,opsz,wght@0,14..32,100..900;1,14..32,100..900&display=swap" rel="stylesheet">

  <link rel="icon" type="image/png" sizes="32x32" href="./assets/images/favicon-32x32.png">
  
  <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>

  <title>Social links profile</title>
</head>  

<body class="font-[Inter] flex flex-col justify-center items-center min-h-screen bg-[hsl(0,0%,8%)] p-0 m-0">

  <div class="flex flex-col items-center  bg-[hsl(0,0%,12%)]  h-115 w-70 rounded-lg">
    <img src="./assets/images/avatar-jessica.jpeg" alt="user-avatar" class="rounded-full h-15 w-15 mt-8">

    <div class="flex flex-col items-center">
      <h1 class="text-[hsl(0,0%,85%)] tracking-wide text-[1rem] mt-6">Jessica Randall</h1>
      <p class="text-[hsl(74,53%,57%)] text-[0.60rem] mt-2">London, United Kingdom</p>
      <p class="text-[hsl(0,0%,51%)] text-[0.65rem] mt-4">"Front-end developer and avid reader."</p>
    </div>
    
    <div class="flex flex-col justify-center items-center mt-4 text-[hsl(0,0%,82%)]">
      <a href="#" class="font-medium flex flex-col items-center w-60 mb-3 bg-[hsl(0,0%,20%)] pt-1.5 pb-1.5 rounded-lg text-[0.85rem] hover:bg-[hsl(75,94%,57%)] hover:text-black hover:cursor-pointer focus:outline-2 focus:outline-offset-2 focus:outline-amber-300 focus-visible:outline-2 active:bg-amber-400">GitHub</a>
      <a href="#" class="font-medium flex flex-col items-center w-60 mb-3 bg-[hsl(0,0%,20%)] pt-1.5 pb-1.5 rounded-lg text-[0.85rem] hover:bg-[hsl(75,94%,57%)] hover:text-black hover:cursor-pointer focus:outline-2 focus:outline-offset-2 focus:outline-amber-300 focus-visible:outline-2 active:bg-amber-400">Frontend Mentor</a>
      <a href="#" class="font-medium flex flex-col items-center w-60 mb-3 bg-[hsl(0,0%,20%)] pt-1.5 pb-1.5 rounded-lg text-[0.85rem] hover:bg-[hsl(75,94%,57%)] hover:text-black hover:cursor-pointer focus:outline-2 focus:outline-offset-2 focus:outline-amber-300 focus-visible:outline-2 active:bg-amber-400">LinkedIn</a>
      <a href="#" class="font-medium flex flex-col items-center w-60 mb-3 bg-[hsl(0,0%,20%)] pt-1.5 pb-1.5 rounded-lg text-[0.85rem] hover:bg-[hsl(75,94%,57%)] hover:text-black hover:cursor-pointer focus:outline-2 focus:outline-offset-2 focus:outline-amber-300 focus-visible:outline-2 active:bg-amber-400">Twitter</a>
      <a href="#" class="font-medium flex flex-col items-center w-60 mb-3 bg-[hsl(0,0%,20%)] pt-1.5 pb-1.5 rounded-lg text-[0.85rem] hover:bg-[hsl(75,94%,57%)] hover:text-black hover:cursor-pointer focus:outline-2 focus:outline-offset-2 focus:outline-amber-300 focus-visible:outline-2 active:bg-amber-400">Instagram</a>
    </div>
  </div>
  
</body>
</html>
